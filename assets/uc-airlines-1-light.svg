<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 363" width="1000" height="363" role="img" aria-labelledby="t d"><title id="t">Payments desk transformation</title><desc id="d">Airlines use case: Payments desk transformation. Problem: Paid-but-unbooked cases took 15–30 min across three systems. AI did: Searched, reserved, enrolled, billed, retrieved booking, closed case. Solution did: Integrated three systems; human confirm gates; escalation matrix and audits. Business outcome: Under 5 min per case (target). Maturity M3 · L3; KPI: time. Architecture: CRM case → AI workspace chat → Payment gateway + reservation system → Human confirms → Payment link → booking ref → CRM auto-close.</desc><defs><clipPath id="clip"><rect width="1000" height="363" rx="22"/></clipPath></defs><rect x="0" y="0" width="1000" height="363" rx="22" fill="#F7F6F1"/><g clip-path="url(#clip)"><circle cx="1020" cy="-72.6" r="300" fill="#C2FE80" opacity="0"/><circle cx="1020" cy="-72.6" r="292" fill="#C2FE80" opacity="0"/><circle cx="1020" cy="-72.6" r="283.9" fill="#C2FE80" opacity="0"/><circle cx="1020" cy="-72.6" r="275.7" fill="#C2FE80" opacity="0"/><circle cx="1020" cy="-72.6" r="267.5" fill="#C2FE80" opacity="0"/><circle cx="1020" cy="-72.6" r="259.3" fill="#C2FE80" opacity="0"/><circle cx="1020" cy="-72.6" r="251" fill="#C2FE80" opacity="0"/><circle cx="1020" cy="-72.6" r="242.6" fill="#C2FE80" opacity="0"/><circle cx="1020" cy="-72.6" r="234.1" fill="#C2FE80" opacity="0"/><circle cx="1020" cy="-72.6" r="225.5" fill="#C2FE80" opacity="0"/><circle cx="1020" cy="-72.6" r="216.9" fill="#C2FE80" opacity="0"/><circle cx="1020" cy="-72.6" r="208.2" fill="#C2FE80" opacity="0"/><circle cx="1020" cy="-72.6" r="199.4" fill="#C2FE80" opacity="0"/><circle cx="1020" cy="-72.6" r="190.5" fill="#C2FE80" opacity="0"/><circle cx="1020" cy="-72.6" r="181.4" fill="#C2FE80" opacity="0"/><circle cx="1020" cy="-72.6" r="172.3" fill="#C2FE80" opacity="0"/><circle cx="1020" cy="-72.6" r="163.1" fill="#C2FE80