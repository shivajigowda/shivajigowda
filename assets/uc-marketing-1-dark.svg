<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" role="img" aria-labelledby="t d"><title id="t">Predictive marketing at MoEngage (2021–24)</title><desc id="d">Marketing use case: Predictive marketing at MoEngage (2021–24). Problem: Right message, right user, right time, right channel (BFSI and retail). AI did: Sherpa (now Merlin AI): Best Time to Send, Most Preferred Channel, Predictions, Dynamic A/B. Solution did: SDKs + Data API + warehouse imports, RFM segments, Flows (journeys). Business outcome: Lifecycle engagement ↑ · retention ↑ · CTR ↑ · CVR ↑ (achieved). KPI: revenue. Architecture: SDKs + Data API → Warehouse + S3/SFTP imports → RFM segments → Sherpa: BTS · MPC · predictions → Flows + Dynamic A/B.</desc><defs><clipPath id="clip"><rect width="1000" height="380" rx="22"/></clipPath></defs><rect x="0" y="0" width="1000" height="380" rx="22" fill="#0F0D1A"/><g clip-path="url(#clip)"><circle cx="1020" cy="-76" r="300" fill="#6E9E1E" opacity="0"/><circle cx="1020" cy="-76" r="292" fill="#6E9E1E" opacity="0"/><circle cx="1020" cy="-76" r="283.9" fill="#6E9E1E" opacity="0"/><circle cx="1020" cy="-76" r="275.7" fill="#6E9E1E" opacity="0"/><circle cx="1020" cy="-76" r="267.5" fill="#6E9E1E" opacity="0"/><circle cx="1020" cy="-76" r="259.3" fill="#6E9E1E" opacity="0"/><circle cx="1020" cy="-76" r="251" fill="#6E9E1E" opacity="0"/><circle cx="1020" cy="-76" r="242.6" fill="#6E9E1E" opacity="0"/><circle cx="1020" cy="-76" r="234.1" fill="#6E9E1E" opacity="0"/><circle cx="1020" cy="-76" r="225.5" fill="#6E9E1E" opacity="0"/><circle cx="1020" cy="-76" r="216.9" fill="#6E9E1E" opacity="0"/><circle cx="1020" cy="-76" r="208.2" fill="#6E9E1E" opacity="0"/><circle cx="1020" cy="-76" r="199.4" fill="#6E9E1E" opacity="0"/><circle cx="1020" cy="-76" r="190.5" fill="#6E9E1E" opacity="0"/><circle cx="1020" cy="-76" r="181.4" fill="#6E9E1E" opacity="0"/><circle cx="1020" cy="-76" r="172.3" fill="#6E9E1E" opacity="0"/><circle cx="1020" cy="-7