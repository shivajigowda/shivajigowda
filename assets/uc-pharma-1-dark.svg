<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 397" width="1000" height="397" role="img" aria-labelledby="t d"><title id="t">Production planning &amp; plant / machine optimization</title><desc id="d">Pharma use case: Production planning &amp; plant / machine optimization. Problem: 16–17 planners took 10 days on monthly batch and machine plans in spreadsheets. AI did: Applied batch rules, checked readiness and equipment qualification, grouped batches, drafted machine-level plan. Solution did: Linked custom objects, shadow run, zero-violation guardrail, accuracy and ROI measurement. Business outcome: Plan in about 1 hour, 80%+ effort cut, fewer batches and changeovers (targets). KPI: time. Architecture: ERP + quality exports → 11 linked custom objects → Planning agent: readiness + batch skills → Plan pack → Planner + QA approve.</desc><defs><clipPath id="clip"><rect width="1000" height="397" rx="22"/></clipPath></defs><rect x="0" y="0" width="1000" height="397" rx="22" fill="#0F0D1A"/><g clip-path="url(#clip)"><circle cx="1020" cy="-79.4" r="300" fill="#6E9E1E" opacity="0"/><circle cx="1020" cy="-79.4" r="292" fill="#6E9E1E" opacity="0"/><circle cx="1020" cy="-79.4" r="283.9" fill="#6E9E1E" opacity="0"/><circle cx="1020" cy="-79.4" r="275.7" fill="#6E9E1E" opacity="0"/><circle cx="1020" cy="-79.4" r="267.5" fill="#6E9E1E" opacity="0"/><circle cx="1020" cy="-79.4" r="259.3" fill="#6E9E1E" opacity="0"/><circle cx="1020" cy="-79.4" r="251" fill="#6E9E1E" opacity="0"/><circle cx="1020" cy="-79.4" r="242.6" fill="#6E9E1E" opacity="0"/><circle cx="1020" cy="-79.4" r="234.1" fill="#6E9E1E" opacity="0"/><circle cx="1020" cy="-79.4" r="225.5" fill="#6E9E1E" opacity="0"/><circle cx="1020" cy="-79.4" r="216.9" fill="#6E9E1E" opacity="0"/><circle cx="1020" cy="-79.4" r="208.2" fill="#6E9E1E" opacity="0"/><circle cx="1020" cy="-79.4" r="199.4" fill="#6E9E1E" opacity="0"/><circle cx="1020" cy="-79.4" r="190.5" fill="#6E9E1E" opacity="0"/><circle cx="1020" cy="-79.4" r="1