<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 363" width="1000" height="363" role="img" aria-labelledby="t d"><title id="t">Customer-experience agent</title><desc id="d">Retail &amp; D2C use case: Customer-experience agent. Problem: Brittle 95-node bot could not absorb launch-surge support. AI did: Chose skills; answered orders, returns, refunds in natural language. Solution did: Unified four systems; one re-skinnable agent; human escalation wired. Business outcome: ~76% deflection through ~14x surge. KPI: cost. Architecture: Storefront · shipping · returns · tracking → Sync layer: one customer record → Identity + cross-channel memory → CX agent, 8 skills → WhatsApp + email; human team.</desc><defs><clipPath id="clip"><rect width="1000" height="363" rx="22"/></clipPath></defs><rect x="0" y="0" width="1000" height="363" rx="22" fill="#F7F6F1"/><g clip-path="url(#clip)"><circle cx="1020" cy="-72.6" r="300" fill="#C2FE80" opacity="0"/><circle cx="1020" cy="-72.6" r="292" fill="#C2FE80" opacity="0"/><circle cx="1020" cy="-72.6" r="283.9" fill="#C2FE80" opacity="0"/><circle cx="1020" cy="-72.6" r="275.7" fill="#C2FE80" opacity="0"/><circle cx="1020" cy="-72.6" r="267.5" fill="#C2FE80" opacity="0"/><circle cx="1020" cy="-72.6" r="259.3" fill="#C2FE80" opacity="0"/><circle cx="1020" cy="-72.6" r="251" fill="#C2FE80" opacity="0"/><circle cx="1020" cy="-72.6" r="242.6" fill="#C2FE80" opacity="0"/><circle cx="1020" cy="-72.6" r="234.1" fill="#C2FE80" opacity="0"/><circle cx="1020" cy="-72.6" r="225.5" fill="#C2FE80" opacity="0"/><circle cx="1020" cy="-72.6" r="216.9" fill="#C2FE80" opacity="0"/><circle cx="1020" cy="-72.6" r="208.2" fill="#C2FE80" opacity="0"/><circle cx="1020" cy="-72.6" r="199.4" fill="#C2FE80" opacity="0"/><circle cx="1020" cy="-72.6" r="190.5" fill="#C2FE80" opacity="0"/><circle cx="1020" cy="-72.6" r="181.4" fill="#C2FE80" opacity="0"/><circle cx="1020" cy="-72.6" r="172.3" fill="#C2FE80" opacity="0"/><circle cx="1020" cy="-72.6" r="163.1" fi