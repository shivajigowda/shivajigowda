<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" role="img" aria-labelledby="t d"><title id="t">Predictive marketing at MoEngage (2021–24)</title><desc id="d">Marketing use case: Predictive marketing at MoEngage (2021–24). Problem: Right message, right user, right time, right channel (BFSI and retail). AI did: Sherpa (now Merlin AI): Best Time to Send, Most Preferred Channel, Predictions, Dynamic A/B. Solution did: SDKs + Data API + warehouse imports, RFM segments, Flows (journeys). Business outcome: MAU / DAU ↑ · lifecycle engagement ↑ · retention ↑ · CTR ↑ · CVR ↑. KPI: revenue. Architecture: SDKs + Data API → Warehouse + S3/SFTP imports → RFM segments → Sherpa: BTS · MPC · predictions → Flows + Dynamic A/B.</desc><defs><clipPath id="clip"><rect width="1000" height="380" rx="22"/></clipPath></defs><rect x="0" y="0" width="1000" height="380" rx="22" fill="#F7F6F1"/><g clip-path="url(#clip)"><circle cx="1020" cy="-76" r="300" fill="#C2FE80" opacity="0"/><circle cx="1020" cy="-76" r="292" fill="#C2FE80" opacity="0"/><circle cx="1020" cy="-76" r="283.9" fill="#C2FE80" opacity="0"/><circle cx="1020" cy="-76" r="275.7" fill="#C2FE80" opacity="0"/><circle cx="1020" cy="-76" r="267.5" fill="#C2FE80" opacity="0"/><circle cx="1020" cy="-76" r="259.3" fill="#C2FE80" opacity="0"/><circle cx="1020" cy="-76" r="251" fill="#C2FE80" opacity="0"/><circle cx="1020" cy="-76" r="242.6" fill="#C2FE80" opacity="0"/><circle cx="1020" cy="-76" r="234.1" fill="#C2FE80" opacity="0"/><circle cx="1020" cy="-76" r="225.5" fill="#C2FE80" opacity="0"/><circle cx="1020" cy="-76" r="216.9" fill="#C2FE80" opacity="0"/><circle cx="1020" cy="-76" r="208.2" fill="#C2FE80" opacity="0"/><circle cx="1020" cy="-76" r="199.4" fill="#C2FE80" opacity="0"/><circle cx="1020" cy="-76" r="190.5" fill="#C2FE80" opacity="0"/><circle cx="1020" cy="-76" r="181.4" fill="#C2FE80" opacity="0"/><circle cx="1020" cy="-76" r="172.3" fill="#C2FE80" opacity="0"/><circle cx="1020" cy=